services:
  madlad-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: madlad-api
    ports:
      - "8001:8000"
    env_file:
      - .env
    gpus: all
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - huggingface-cache:/models/huggingface

volumes:
  huggingface-cache:
