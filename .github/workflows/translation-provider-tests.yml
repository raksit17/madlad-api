name: Translation provider tests

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lightweight dependencies (no GPU required)
        run: python -m pip install fastapi httpx pydantic-settings
      - name: Run provider and API compatibility tests
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run stream capture and learning tests
        run: node --test tests/stream.test.mjs

